<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Smart Lock Real-Time Dashboard</title>
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090b11;
      --card-bg: rgba(22, 28, 45, 0.4);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success-glow: rgba(16, 185, 129, 0.15);
      --danger-glow: rgba(239, 68, 68, 0.15);
      --warning-glow: rgba(245, 158, 11, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
    }

    header {
      padding: 2rem 4rem;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      background: linear-gradient(135deg, #a5b4fc 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 50px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--danger);
      box-shadow: 0 0 10px var(--danger);
      transition: all 0.3s ease;
    }

    .status-dot.connected {
      background-color: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    main {
      flex: 1;
      padding: 3rem 4rem;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 3rem;
    }

    @media (max-width: 1024px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #cbd5e1;
      letter-spacing: -0.02em;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    .stat-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      transition: transform 0.2s ease;
    }

    .stat-box:hover {
      transform: translateY(-2px);
    }

    .stat-label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
    }

    .stat-box.success {
      background: var(--success-glow);
      border-color: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    .stat-box.danger {
      background: var(--danger-glow);
      border-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .stat-box.warning {
      background: var(--warning-glow);
      border-color: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    /* Devices Status List styles */
    .devices-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .device-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .device-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .device-name {
      font-weight: 600;
      font-size: 0.95rem;
      font-family: 'Space Grotesk', sans-serif;
    }

    .device-status-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .device-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--text-muted);
      box-shadow: 0 0 5px var(--text-muted);
      transition: all 0.3s ease;
    }

    .device-indicator.online {
      background-color: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .device-indicator.offline {
      background-color: var(--danger);
      box-shadow: 0 0 10px var(--danger);
    }

    .device-item-empty {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
      padding: 1rem 0;
    }

    .logs-panel {
      display: flex;
      flex-direction: column;
      height: 750px;
    }

    .logs-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding-right: 0.5rem;
    }

    /* Custom scrollbar */
    .logs-container::-webkit-scrollbar {
      width: 6px;
    }
    .logs-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .logs-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .log-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      animation: slideIn 0.3s ease forwards;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }

    .log-badge.unlocked {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .log-badge.denied {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .log-badge.failed {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .log-badge.info {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .log-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .log-message {
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.4;
    }

    .log-meta {
      display: flex;
      gap: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      padding-top: 0.6rem;
    }

    .empty-logs {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      gap: 1rem;
    }

    .empty-icon {
      font-size: 3rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <header>
    <h1>IoT Smart Lock Live Monitor</h1>
    <div class="connection-status">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Disconnected</span>
    </div>
  </header>

  <main>
    <div class="sidebar">
      <div class="card">
        <h2 class="card-title">Access Statistics</h2>
        <div class="stats-grid">
          <div class="stat-box success">
            <span class="stat-label">Successful Entries</span>
            <span id="statSuccess" class="stat-value">0</span>
          </div>
          <div class="stat-box danger">
            <span class="stat-label">Access Denied</span>
            <span id="statDenied" class="stat-value">0</span>
          </div>
          <div class="stat-box warning">
            <span class="stat-label">Hardware Failures / Timeouts</span>
            <span id="statFailed" class="stat-value">0</span>
          </div>
        </div>
      </div>

      <!-- Live Lock Status Grid -->
      <div class="card">
        <h2 class="card-title">Registered Smart Locks</h2>
        <div id="devicesList" class="devices-list">
          <div class="device-item-empty">No active lock heartbeats detected yet.</div>
        </div>
      </div>
    </div>

    <div class="card logs-panel">
      <h2 class="card-title">Live Log Activity Feed</h2>
      <div id="logsContainer" class="logs-container">
        <div id="emptyState" class="empty-logs">
          <span class="empty-icon">📡</span>
          <span>Waiting for live events from the backend...</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const logsContainer = document.getElementById('logsContainer');
    const emptyState = document.getElementById('emptyState');
    const devicesList = document.getElementById('devicesList');

    // Stats elements
    const statSuccessEl = document.getElementById('statSuccess');
    const statDeniedEl = document.getElementById('statDenied');
    const statFailedEl = document.getElementById('statFailed');

    let statSuccessCount = 0;
    let statDeniedCount = 0;
    let statFailedCount = 0;

    // Connect to WebSocket Server (uses same port as Express)
    function connectWS() {
      const wsUrl = `ws://${window.location.hostname || 'localhost'}:3000`;
      console.log(`Connecting to WebSocket: ${wsUrl}`);
      const socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        statusDot.className = 'status-dot connected';
        statusText.innerText = 'Connected';
        console.log('Connected to WS Broker.');
      };

      socket.onclose = () => {
        statusDot.className = 'status-dot';
        statusText.innerText = 'Disconnected - Retrying...';
        console.log('Disconnected. Retrying connection in 3 seconds...');
        setTimeout(connectWS, 3000);
      };

      socket.onerror = (err) => {
        console.error('WebSocket error:', err);
      };

      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);
        handleWSMessage(message);
      };
    }

    function handleWSMessage(msg) {
      if (emptyState && document.getElementById('emptyState')) {
        emptyState.remove();
      }

      const { type, payload, timestamp } = msg;
      const formattedTime = new Date(timestamp).toLocaleTimeString();

      // Update Device List dynamically
      const lockId = payload.lockId;
      if (lockId) {
        const emptyMsg = devicesList.querySelector('.device-item-empty');
        if (emptyMsg) {
          emptyMsg.remove();
        }

        let deviceItem = document.getElementById(`device-${lockId}`);
        if (!deviceItem) {
          deviceItem = document.createElement('div');
          deviceItem.className = 'device-item';
          deviceItem.id = `device-${lockId}`;
          devicesList.appendChild(deviceItem);
        }

        let isOnline = true;
        let lockStatusText = 'Online';

        if (type === 'LOCK_OFFLINE') {
          isOnline = false;
          lockStatusText = 'Offline';
        } else if (type === 'LOCK_ONLINE') {
          isOnline = true;
          lockStatusText = 'Online';
        } else {
          // Carry forward online state
          const prevIndicator = deviceItem.querySelector('.device-indicator');
          isOnline = prevIndicator ? prevIndicator.classList.contains('online') : true;
          const prevStatusTextEl = deviceItem.querySelector('.device-status-label');
          lockStatusText = prevStatusTextEl ? prevStatusTextEl.innerText : (isOnline ? 'Online' : 'Offline');
        }

        // Apply lock status tags
        if (isOnline) {
          if (type === 'LOCK_UNLOCKED') {
            lockStatusText = 'Online - Unlocked';
          } else if (type === 'LOCK_STATUS_CHANGED' && payload.status === 'LOCKED') {
            lockStatusText = 'Online - Locked';
          } else if (type === 'LOCK_STATUS_CHANGED' && payload.status === 'UNLOCKED') {
            lockStatusText = 'Online - Unlocked';
          }
        } else {
          lockStatusText = 'Offline';
        }

        const indicatorClass = isOnline ? 'online' : 'offline';

        deviceItem.innerHTML = `
          <div class="device-info">
            <span class="device-name">${lockId}</span>
            <span class="device-status-label">${lockStatusText}</span>
          </div>
          <div class="device-indicator ${indicatorClass}"></div>
        `;
      }

      // Create log element
      const logItem = document.createElement('div');
      logItem.className = 'log-item';

      let badgeText = type;
      let badgeClass = 'info';

      if (type === 'LOCK_UNLOCKED') {
        badgeText = 'Unlocked';
        badgeClass = 'unlocked';
        statSuccessCount++;
        statSuccessEl.innerText = statSuccessCount;
      } else if (type === 'ACCESS_DENIED') {
        badgeText = 'Denied';
        badgeClass = 'denied';
        statDeniedCount++;
        statDeniedEl.innerText = statDeniedCount;
      } else if (type === 'UNLOCK_FAILED') {
        badgeText = 'Failed';
        badgeClass = 'failed';
        statFailedCount++;
        statFailedEl.innerText = statFailedCount;
      } else if (type === 'LOCK_ONLINE') {
        badgeText = 'Online';
        badgeClass = 'unlocked';
      } else if (type === 'LOCK_OFFLINE') {
        badgeText = 'Offline';
        badgeClass = 'denied';
      } else if (type === 'LOCK_STATUS_CHANGED') {
        badgeText = 'Status';
        badgeClass = 'info';
      } else if (type === 'SYSTEM_INFO') {
        badgeText = 'System';
        badgeClass = 'info';
      }

      logItem.innerHTML = `
        <div class="log-header">
          <span class="log-badge ${badgeClass}">${badgeText}</span>
          <span class="log-time">${formattedTime}</span>
        </div>
        <div class="log-message">${payload.message || 'No details provided'}</div>
        <div class="log-meta">
          <span>Lock: <strong>${payload.lockId || 'N/A'}</strong></span>
          <span>Method: <strong>${payload.method || 'SYSTEM'}</strong></span>
          ${payload.reason ? `<span>Reason: <strong style="color:var(--danger)">${payload.reason}</strong></span>` : ''}
          ${payload.userId ? `<span>User: <strong>${payload.userId.substring(0,8)}...</strong></span>` : ''}
        </div>
      `;

      // Prepend to show newest logs at the top
      logsContainer.insertBefore(logItem, logsContainer.firstChild);

      // Keep only last 50 logs in DOM
      if (logsContainer.children.length > 50) {
        logsContainer.lastChild.remove();
      }
    }

    // Initialize
    connectWS();
  </script>
</body>
</html>
